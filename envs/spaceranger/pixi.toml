# Pixi environment for Space Ranger (Visium HD).
#
# Space Ranger is proprietary and is not published on conda-forge or bioconda,
# so this manifest installs nothing; it only puts the cluster-wide install on
# PATH via activation. There is no `spaceranger` module on HPC3.
#
# Kept as a standalone manifest rather than a feature of the workspace
# pixi.toml so that solving it does not require the conda-to-PyPI mapping
# needed by the squidpy-dfs PyPI dependencies.
#
# Usage:
#   pixi run --manifest-path envs/spaceranger/pixi.toml spaceranger count ...

[workspace]
name = "spaceranger"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]

[activation.env]
SPACERANGER_HOME = "/dfs8/commondata/spaceranger/spaceranger-3.1.2"
PATH = "/dfs8/commondata/spaceranger/spaceranger-3.1.2:$PATH"
