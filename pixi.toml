[workspace]
authors = ["Kevin Stachelek <kstachel@uci.edu>"]
channels = ["conda-forge"]
name = "squidpy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# fast Python on /dfs9: run inside the squidpy-dfs Apptainer image
# (envs/squidpy/squidpy.def); build once, rebuild when pixi.lock changes
build-sif = "sbatch src/submit_build_squidpy_sif.sh"
py = "bash src/sif_exec.sh python"
ipy = "bash src/sif_exec.sh ipython"

[dependencies]

[feature.squidpy-dfs]
channels = ["conda-forge", "bioconda"]

[feature.squidpy-dfs.dependencies]
squidpy = "*"
ipykernel = "*"
ca-certificates = "*"
certifi = "*"
openssl = "*"
statsmodels = "0.14.*"

[feature.squidpy-dfs.pypi-dependencies]
adjusttext = "==1.3.0"
et-xmlfile = "==2.0.0"
geodatasets = "==2026.1.0"
gseapy = "==1.1.12"
mizani = "==0.14.4"
openpyxl = "==3.1.5"
plotnine = "==0.15.3"
polars = "==1.38.1"
polars-runtime-32 = "==1.38.1"
scikit-misc = "==0.5.2"

[environments]
squidpy-dfs = { features = ["squidpy-dfs"], no-default-feature = true }
