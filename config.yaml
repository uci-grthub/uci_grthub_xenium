# Multi-sample configuration file for CellRanger Snakemake workflow

# ENSEMBL_RELEASE=84
# ENSEMBL_GRCh38_BASE=ftp://ftp.ensembl.org/pub/release-${ENSEMBL_RELEASE}/fasta/homo_sapiens/dna

# List of samples to process  
# NOTE: Samples are now auto-detected from data/FASTQ directory
# The following list is used as fallback if auto-detection fails
samples:

metadata: "data/metadata.csv"

# Input/Output paths
paths: 
  fastqs: "data/FASTQ"
  output: "output"


# Reference genome/transcriptome
references:
  # Human reference (default)
  transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-GRCh38-3.0.0"
  # Mouse reference (alternative)
  # transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-mm10-1.2.0"
  repeat_mask: "/dfs9/ucightf-lab/kstachel/kstachel_references/repeatmasker/Homo_sapiens_rm_refseq.out.gz"

# CellRanger parameters
params:
  localcores: 8
  localmem: 128  # GB
  chemistry: "SC3Pv4"

# Space Ranger (Visium HD) parameters
spaceranger:
  # pixi manifest that puts the cluster-wide Space Ranger install on PATH
  pixi_manifest: "envs/spaceranger/pixi.toml"
  transcriptome: "/dfs8/commondata/spaceranger/ref/refdata-gex-GRCh38-2020-A"
  probe_set: "/dfs8/commondata/spaceranger/probe/Human_V2/Visium_Human_Transcriptome_Probe_Set_v2.0_GRCh38-2020-A.csv"
  # searched recursively for <sample>_S*_L*_R1_*.fastq.gz
  fastq_root: "data"
  # CytAssist run folders: each holds a *-run-info.csv plus one tif per capture area
  cytassist_dir: "metadata/H_E_images_out_0526I_16/CytAssist"
  create_bam: false
  localcores: 24
  localmem: 112  # GB
  # extra bin size in microns, in addition to the standard 2/8/16 um (null = none)
  custom_bin_size:
  # per-sample overrides; slide and area are read from the CytAssist image
  # metadata unless set here
  samples:
    A1_TMA4:
      image: "metadata/H_E_images_out_0526I_16/TIFF/TMA 4.tif"

# scVI integration parameters
min_genes: 200
min_cells: 5
mt_thresh: 5
n_top_genes: 2000
batch_key: "batch"

## Scenic
TFs: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/hs_hgnc_curated_tfs.txt"
motifs: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/motifs-v9-nr.hgnc.tbl"
feather_db: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/hg38_refseq-10kb_up_and_down_tss.mc9nr.feather"

# Available references (for documentation)
# Main directory: /dfs8/commondata/cellranger/
# Human: refdata-cellranger-GRCh38-3.0.0 
# Mouse: refdata-cellranger-mm10-1.2.0
