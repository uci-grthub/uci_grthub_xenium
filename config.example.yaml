# Copy to config.yaml (gitignored) and fill in for your project:
#   cp config.example.yaml config.yaml
# Configuration for the Xenium workflow (and idle Cell Ranger rules)

# ENSEMBL_RELEASE=84
# ENSEMBL_GRCh38_BASE=ftp://ftp.ensembl.org/pub/release-${ENSEMBL_RELEASE}/fasta/homo_sapiens/dna

# List of samples to process  
# NOTE: Samples are now auto-detected from data/FASTQ directory
# The following list is used as fallback if auto-detection fails
samples:

metadata: "data/metadata.csv"

# Who gets the workflow's start/done/error mail; leave empty to disable
email: ""

# SLURM accounts for rules that set resources.account (Cell Ranger and
# single-cell rules); list yours with: sacctmgr -nP show assoc user=$USER format=Account
slurm_account: ""
slurm_gpu_account: ""

# multiqc container for rule multiqc
multiqc_sif: "/path/to/multiqc-1.20.sif"

# Project report (rule xenium_report -> <output>/Xenium_Project_Report.pdf)
report:
  author: ""
  # python with reportlab, pandas, pyyaml and Pillow; build it with
  # pixi install --manifest-path envs/report/pixi.toml
  python: "envs/report/.pixi/envs/default/bin/python"

# Input/Output paths
paths: 
  fastqs: "data/FASTQ"
  output: "output"


# Reference genome/transcriptome
references:
  # Human reference (default)
  transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-GRCh38-3.0.0"
  # Mouse reference (alternative)
  # transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-mm10-1.2.0"
  repeat_mask: "/path/to/repeatmasker/Homo_sapiens_rm_refseq.out.gz"

# CellRanger parameters
params:
  localcores: 8
  localmem: 128  # GB
  chemistry: "SC3Pv4"

# Xenium: output-XETG* directories (one per region) are found by searching
# data_root recursively for experiment.xenium
xenium:
  data_root: "data"
  # per-sample AnnData (rule xenium_anndata); python needs scanpy + leidenalg
  python: "/path/to/envs/squidpy/bin/python"
  min_genes: 10
  min_cells: 5
  leiden_resolution: 0.3
  # normalization: counts / cell_area * target_area (µm²), then log1p; one
  # constant for every sample and the merged object (like Seurat scale.factor)
  target_area: 100
  # batch correction for merged objects: none | harmony (Harmony on the PCs
  # over sample_id; neighbors/UMAP/Leiden use the corrected PCs, X stays as is)
  batch_correction: "none"
  # merged objects (output/xenium/anndata/merged/<group>.h5ad): group name ->
  # glob over sample ids (<slide>_<region>)
  merge_groups:
    merged: "*"
    # slide_0012345: "0012345_*"

# Azimuth cell type annotation (rule xenium_azimuth_all, rules/azimuth.smk):
# a reference built from a labeled CELLxGENE scRNA-seq atlas, restricted to
# the Xenium panel genes, mapped onto each sample's raw counts
azimuth:
  # Rscript with Seurat 5 + Azimuth; build once with sbatch src/install_azimuth_env.sh
  rscript: "envs/azimuth/.pixi/envs/default/bin/Rscript"
  # CELLxGENE dataset .h5ad (raw counts in raw/X); default Tabula Muris Senis
  # 10x, all tissues (3.7 GB)
  reference_url: "https://datasets.cellxgene.cziscience.com/084058cc-4f17-43ce-b14e-1278df074013.h5ad"
  # reference obs columns to transfer; the first one is subset and plotted
  label_columns: ["cell_type"]
  # reference cells kept, by the first label column: cell types that can
  # occur in skin and skin tumors (organ-specific types, progenitors and vague
  # labels like "leukocyte" dropped); empty keeps every cell
  keep_labels:
    # epidermis
    - "basal cell of epidermis"
    - "epidermal cell"
    - "keratinocyte"
    - "keratinocyte stem cell"
    - "stem cell of epidermis"
    # stroma, vasculature, nerve, muscle (panniculus carnosus)
    - "fibroblast"
    - "endothelial cell"
    - "vein endothelial cell"
    - "endothelial cell of lymphatic vessel"
    - "pericyte"
    - "smooth muscle cell"
    - "Schwann cell"
    - "cell of skeletal muscle"
    # lymphoid
    - "B cell"
    - "naive B cell"
    - "plasma cell"
    - "T cell"
    - "CD4-positive, alpha-beta T cell"
    - "CD8-positive, alpha-beta T cell"
    - "regulatory T cell"
    - "naive T cell"
    - "mature NK T cell"
    - "natural killer cell"
    # myeloid
    - "macrophage"
    - "classical monocyte"
    - "non-classical monocyte"
    - "intermediate monocyte"
    - "monocyte"
    - "dendritic cell"
    - "myeloid dendritic cell"
    - "plasmacytoid dendritic cell"
    - "Langerhans cell"
    - "neutrophil"
    - "mast cell"
    - "basophil"
  # random subsample per cell type, keeps the reference small and balanced
  max_cells_per_label: 2000
  # cells whose prediction score (Azimuth's confidence in the label, 0-1) is
  # below this are labeled "unassigned"; the label is kept in
  # azimuth_<label>_raw. 0.5 drops low-count cells that Azimuth otherwise
  # puts on immune types they do not express (e.g. 15% "plasma cells" with
  # no Mzb1 in normal skin)
  min_prediction_score: 0.5
  dims: 50

# scVI integration parameters
min_genes: 200
min_cells: 5
mt_thresh: 5
n_top_genes: 2000
batch_key: "batch"

## Scenic
TFs: "/path/to/scenic/hs_hgnc_curated_tfs.txt"
motifs: "/path/to/scenic/motifs-v9-nr.hgnc.tbl"
feather_db: "/path/to/scenic/hg38_refseq-10kb_up_and_down_tss.mc9nr.feather"

# Available references (for documentation)
# Main directory: /dfs8/commondata/cellranger/
# Human: refdata-cellranger-GRCh38-3.0.0 
# Mouse: refdata-cellranger-mm10-1.2.0
